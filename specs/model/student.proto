syntax = "proto3";

import "university.proto";
import "class.proto";
import "google/protobuf/timestamp.proto";

enum Grade {
  GRADE_UNSPECIFIED = 0;
  GRADE_1 = 1;
  GRADE_2 = 2;
  GRADE_3 = 3;
  GRADE_4 = 4;
  GRADE_5 = 5;
  GRADE_6 = 6;
  GRADE_7 = 7;
  GRADE_8 = 8;
  GRADE_9 = 9;  
}

message Student {
  string id = 1;
  string name = 2;
  Department department = 3;
  Grade grade = 4;
}

message StudentClassInfo {
  string student_id = 1;
  string class_id = 2;
  int32 score = 3;
}

message StudentAssignmentInfo {
  string student_id = 1;
  string assignment_id = 2;
  int32 score = 3;
  google.protobuf.Timestamp submitted_at = 4;
  repeated Assignment.Attachment attachments = 5;
}

message Grades {
  string student_id = 1;
  int32 year = 2;
  Semester semester = 3;
  repeated StudentClassInfo class_infos = 4;
  float gpa = 5;
  float gpt = 6;
  float credits = 7;
}